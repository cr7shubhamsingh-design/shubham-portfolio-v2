    <script>
      (function () {
        // A study whose Figma design exists in only one theme opens in that
        // theme, whatever the visitor's site-wide preference is — Camb is drawn
        // dark-only (296:25231 is #121212), so a light page would frame dark
        // artwork in light chrome. Kept inline and pre-paint so there's no
        // flash; the map is small enough not to be worth a module round-trip.
        var PINNED = { camb: 'dark', hobbes: 'light' };
        var match = location.pathname.match(/\/work\/([\w-]+)\/?$/);
        var slug = match ? match[1] : new URLSearchParams(location.search).get('slug');
        var pinned = slug && PINNED[slug];
        var theme = pinned || localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        // A pinned study has nothing to toggle between, so the nav drops its
        // theme button. Set here rather than in JS so it never flashes in.
        if (pinned) {
          document.documentElement.classList.add('theme-locked');
        }
        // Lets a study override page tokens where its frame differs from the
        // shared palette — Camb is drawn on #121212, not the usual #131416.
        if (slug) {
          document.documentElement.setAttribute('data-study', slug);
        }
      })();
    </script>
