<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shubham. — product designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Inter+Tight:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="loading-screen" class="loading-screen">
      <img id="loading-cycle" class="loading-screen__frame" src="/loading-frames/frame-1.svg" alt="shubham" />
    </div>

    <main id="main-screen" class="hero">
      <div class="hero__content">
        <div class="hero__header">
          <img class="hero__logo" src="/logo.svg" alt="shubham." width="167" height="30" />

          <h1 class="hero__headline">
            <span class="hero__line">hi! i am shubham</span>
            <span class="hero__line hero__line--accent">
              a product
              <span class="glitch">
                <img
                  id="designer-cycle"
                  class="glitch__frame"
                  src="/designer-frames/frame-1-flat.svg"
                  alt="designer"
                />
              </span>
            </span>
          </h1>
        </div>

        <div class="hero__footer">
          <p class="hero__subtext">
            Former graphic designer, now a Product Designer with 2+ years of experience shaping
            digital products for startups and big tech.
          </p>

          <div class="hero__actions">
            <a class="btn-primary" href="#contact">Get in touch</a>
            <nav class="social-links" aria-label="Social links">
              <a class="social-link" href="https://x.com" target="_blank" rel="noopener">
                <img src="/icons/x.svg" alt="X (Twitter)" width="16" height="16" />
              </a>
              <a class="social-link" href="https://linkedin.com" target="_blank" rel="noopener">
                <img src="/icons/linkedin.svg" alt="LinkedIn" width="16" height="16" />
              </a>
              <a class="social-link" href="https://instagram.com" target="_blank" rel="noopener">
                <img src="/icons/instagram.svg" alt="Instagram" width="16" height="16" />
              </a>
            </nav>
          </div>
        </div>
      </div>

      <nav class="site-nav" aria-label="Primary">
        <div class="site-nav__pill">
          <img class="site-nav__logo" src="/logo.svg" alt="shubham." width="84" height="15" />
          <button class="site-nav__menu" type="button" aria-label="Open menu">
            <img src="/icons/menu.svg" alt="" width="13" height="11" />
          </button>
        </div>
        <button class="site-nav__theme" type="button" aria-label="Toggle dark mode">
          <img src="/icons/moon.svg" alt="" width="20" height="20" />
        </button>
      </nav>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
