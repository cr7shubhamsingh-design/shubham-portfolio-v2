# Rebuilds the miniplayer's playlist — top 20 on Last.fm over the last 30
# days, one song per artist — on the 15th of every month. Only
# data/top-tracks.json changes; the site reads it at runtime, so this never
# deploys anything. If the run fails, the previous file stays as it is.
name: Update top tracks

on:
  schedule:
    # 00:30 UTC on the 15th = 06:00 IST
    - cron: '30 0 15 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: top-tracks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build playlist from Last.fm
        run: node scripts/update-top-tracks.mjs
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: Aribum

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/top-tracks.json
          if git diff --cached --quiet; then
            echo "Playlist unchanged."
            exit 0
          fi
          git commit -m "Update top tracks for $(date -u +%B\ %Y)"
          git push
